name: Build and release kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - config/**
      - patches/**
      - scripts/download-source.sh
      - scripts/rebuild.sh
      - .github/workflows/build-release.yml
  pull_request:
    paths:
      - config/**
      - patches/**
      - scripts/download-source.sh
      - scripts/rebuild.sh
      - .github/workflows/build-release.yml

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} packages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            format: deb
            artifact: huawei-drc-wxx-kernel
          - name: Fedora
            format: rpm
            artifact: huawei-drc-wxx-kernel-fedora

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install Debian kernel build dependencies
        if: matrix.format == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential bzip2 ca-certificates cpio curl \
            debhelper dpkg-dev dwarves fakeroot flex git kmod libdw-dev \
            libelf-dev libncurses-dev libssl-dev patch python3 rsync xz-utils \
            zstd

      - name: Derive package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+([.][0-9]+)*)$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "Release tags must look like v4 or v5.1" >&2
              exit 1
            fi
          else
            version="0~ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify Ubuntu kernel source
        run: ./scripts/download-source.sh

      - name: Build Debian kernel packages
        if: matrix.format == 'deb'
        env:
          PACKAGE_FORMAT: deb
          KDEB_PKGVERSION: ${{ steps.version.outputs.version }}
          CHECKSUM_FILE: SHA256SUMS.deb
          OUTPUT_DIR: ${{ github.workspace }}/dist
          WORK_ROOT: ${{ runner.temp }}/drc-wxx-kernel-build
        run: ./scripts/rebuild.sh

      - name: Build Fedora kernel packages
        if: matrix.format == 'rpm'
        env:
          RPM_PACKAGE_RELEASE: ${{ github.run_number }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:/build" \
            --workdir /workspace \
            --env RPM_PACKAGE_RELEASE \
            fedora:43 \
            bash -c '
              set -euo pipefail
              dnf install -y \
                bc binutils bison bzip2 cpio curl diffutils dwarves \
                elfutils-devel elfutils-libelf-devel findutils flex gcc git \
                gzip hostname kmod make ncurses-devel openssl openssl-devel \
                patch perl python3 rpm-build rsync tar xz zstd
              PACKAGE_FORMAT=rpm \
              CHECKSUM_FILE=SHA256SUMS.rpm \
              OUTPUT_DIR=/workspace/dist \
              WORK_ROOT=/build/drc-wxx-kernel-build \
                ./scripts/rebuild.sh
            '

      - name: List packages
        run: |
          ls -lh dist
          cat dist/SHA256SUMS.*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: huawei-drc-wxx-kernel
          path: dist/deb

      - name: Download Fedora build artifact
        uses: actions/download-artifact@v4
        with:
          name: huawei-drc-wxx-kernel-fedora
          path: dist/rpm

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Huawei DRC-WXX kernel $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/deb/* dist/rpm/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
